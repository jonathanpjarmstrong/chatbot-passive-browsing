<title>Din Tai Fung Berry-picking Demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500&display=swap">
<style>
:root {
  --ground: #FAF9F7;
  --surface: #FFFFFF;
  --text-primary: #1C1B18;
  --text-secondary: #6B665C;
  --text-muted: #9B9688;
  --user-bubble: #B8342B;
  --user-text: #FFFFFF;
  --bot-bubble: #FFFFFF;
  --bot-border: #EAE6DE;
  --accent: #B8342B;
  --chip-bg: #F5F1EA;
  --chip-border: #EAE6DE;
  --chip-text: #3D3A34;
  --chip-selected-bg: #FDF0EE;
  --chip-selected-border: #B8342B;
  --chip-selected-text: #B8342B;
  --phone-frame: #1C1B18;
  --phone-screen: #FDFCFB;
  --divider: #EAE6DE;
  --shadow: rgba(28, 27, 24, 0.1);
  --trail-color: #B8342B;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #121110;
    --surface: #1E1D1A;
    --text-primary: #F2F1EE;
    --text-secondary: #9B9688;
    --text-muted: #6B665C;
    --user-bubble: #D4453B;
    --user-text: #FFFFFF;
    --bot-bubble: #242320;
    --bot-border: #3A3834;
    --accent: #D4453B;
    --chip-bg: #2A2825;
    --chip-border: #3A3834;
    --chip-text: #D4D0C8;
    --chip-selected-bg: #2E1F1E;
    --chip-selected-border: #D4453B;
    --chip-selected-text: #D4453B;
    --phone-frame: #0A0A09;
    --phone-screen: #1A1917;
    --divider: #3A3834;
    --shadow: rgba(0, 0, 0, 0.35);
    --trail-color: #D4453B;
  }
}

:root[data-theme="dark"] {
  --ground: #121110;
  --surface: #1E1D1A;
  --text-primary: #F2F1EE;
  --text-secondary: #9B9688;
  --text-muted: #6B665C;
  --user-bubble: #D4453B;
  --user-text: #FFFFFF;
  --bot-bubble: #242320;
  --bot-border: #3A3834;
  --accent: #D4453B;
  --chip-bg: #2A2825;
  --chip-border: #3A3834;
  --chip-text: #D4D0C8;
  --chip-selected-bg: #2E1F1E;
  --chip-selected-border: #D4453B;
  --chip-selected-text: #D4453B;
  --phone-frame: #0A0A09;
  --phone-screen: #1A1917;
  --divider: #3A3834;
  --shadow: rgba(0, 0, 0, 0.35);
  --trail-color: #D4453B;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--ground);
  color: var(--text-primary);
  font-family: 'Inter', -apple-system, sans-serif;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.3rem 0.7rem;
  border-radius: 100px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  background: var(--chip-selected-bg);
  color: var(--accent);
}

.phone {
  width: 340px;
  max-width: 100%;
  background: var(--phone-frame);
  border-radius: 2.75rem;
  padding: 0.75rem;
  box-shadow: 0 24px 64px var(--shadow), 0 8px 24px var(--shadow);
}

.phone-screen {
  background: var(--phone-screen);
  border-radius: 2.25rem;
  overflow: hidden;
  height: 600px;
  display: flex;
  flex-direction: column;
}

.phone-status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.55rem 1.25rem 0.35rem;
  font-size: 0.6rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.phone-notch {
  width: 76px;
  height: 22px;
  background: var(--phone-frame);
  border-radius: 100px;
}

.chat-header {
  padding: 0.55rem 1rem;
  border-bottom: 1px solid var(--divider);
  display: flex;
  align-items: center;
  gap: 0.55rem;
}

.chat-header .avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  color: white;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
}

.chat-header .name {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 600;
}

.chat-header .status {
  font-size: 0.6rem;
  color: var(--text-muted);
}

.chat-body {
  flex: 1;
  padding: 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  overflow-y: auto;
  scroll-behavior: smooth;
}

.msg {
  max-width: 88%;
  padding: 0.6rem 0.8rem;
  border-radius: 1.1rem;
  font-size: 0.72rem;
  line-height: 1.45;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}

.msg.visible {
  opacity: 1;
  transform: translateY(0);
}

.msg.bot {
  align-self: flex-start;
  background: var(--bot-bubble);
  color: var(--text-primary);
  border: 1px solid var(--bot-border);
  border-bottom-left-radius: 0.3rem;
}

.msg.user {
  align-self: flex-end;
  background: var(--user-bubble);
  color: var(--user-text);
  border-bottom-right-radius: 0.3rem;
}

.typing-indicator {
  align-self: flex-start;
  display: flex;
  gap: 3.5px;
  padding: 0.65rem 0.85rem;
  background: var(--bot-bubble);
  border: 1px solid var(--bot-border);
  border-radius: 1.1rem;
  border-bottom-left-radius: 0.3rem;
  opacity: 0;
  transition: opacity 0.2s;
}

.typing-indicator.visible { opacity: 1; }

.typing-indicator span {
  width: 6px;
  height: 6px;
  background: var(--text-muted);
  border-radius: 50%;
  animation: bounce 1.2s ease infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-4px); opacity: 1; }
}

.mood-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-top: 0.4rem;
}

.mood-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.2rem;
  padding: 0.35rem 0.6rem;
  background: var(--chip-bg);
  border: 1px solid var(--chip-border);
  border-radius: 100px;
  font-size: 0.63rem;
  font-weight: 500;
  color: var(--chip-text);
  white-space: nowrap;
  transition: all 0.3s ease;
}

.mood-chip.selected {
  background: var(--chip-selected-bg);
  border-color: var(--chip-selected-border);
  color: var(--chip-selected-text);
  transform: scale(1.05);
}

.menu-card {
  background: var(--surface);
  border: 1px solid var(--bot-border);
  border-radius: 0.65rem;
  padding: 0.45rem 0.6rem;
  margin-top: 0.3rem;
}

.menu-item {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 0.38rem 0;
  border-bottom: 1px solid var(--divider);
}

.menu-item:last-child { border-bottom: none; }
.menu-item .item-name { font-size: 0.67rem; font-weight: 500; }
.menu-item .item-desc { font-size: 0.57rem; color: var(--text-secondary); margin-top: 0.05rem; }
.menu-item .item-price { font-size: 0.63rem; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }

.trail-links {
  display: flex;
  flex-direction: column;
  gap: 0.22rem;
  margin-top: 0.35rem;
}

.trail-link {
  font-size: 0.6rem;
  color: var(--trail-color);
  font-weight: 500;
}

.chat-input {
  padding: 0.55rem 0.75rem;
  border-top: 1px solid var(--divider);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.input-field {
  flex: 1;
  background: var(--chip-bg);
  border: 1px solid var(--divider);
  border-radius: 100px;
  padding: 0.45rem 0.75rem;
  font-size: 0.62rem;
  color: var(--text-muted);
}

.send-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
}

.send-btn svg { width: 13px; height: 13px; fill: white; }

.progress-bar {
  width: 340px;
  max-width: 100%;
  height: 3px;
  background: var(--divider);
  border-radius: 2px;
  margin-top: 0.75rem;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  width: 0%;
  transition: width 0.1s linear;
}

.replay-btn {
  margin-top: 0.75rem;
  background: none;
  border: 1px solid var(--divider);
  border-radius: 100px;
  padding: 0.4rem 1rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.3s, border-color 0.2s, color 0.2s;
}

.replay-btn.visible { opacity: 1; }
.replay-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>

<div class="container">
  <span class="badge">🫐 Berry-picking · Din Tai Fung</span>
  <div class="phone">
    <div class="phone-screen">
      <div class="phone-status-bar">
        <span>9:41</span>
        <div class="phone-notch"></div>
        <span>5G</span>
      </div>
      <div class="chat-header">
        <div class="avatar">鼎</div>
        <div>
          <div class="name">Din Tai Fung</div>
          <div class="status">Online</div>
        </div>
      </div>
      <div class="chat-body" id="chat"></div>
      <div class="chat-input">
        <div class="input-field">Or type what you're craving...</div>
        <div class="send-btn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></div>
      </div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <button class="replay-btn" id="replay" onclick="replay()">↺ Replay</button>
</div>

<script>
const chat = document.getElementById('chat');
const progress = document.getElementById('progress');
const replayBtn = document.getElementById('replay');
const DURATION = 15000;
let startTime;
let animFrame;

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

function addElement(html) {
  const wrapper = document.createElement('div');
  wrapper.innerHTML = html;
  const el = wrapper.firstElementChild;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  requestAnimationFrame(() => {
    requestAnimationFrame(() => el.classList.add('visible'));
  });
  return el;
}

function showTyping() {
  const el = addElement('<div class="typing-indicator"><span></span><span></span><span></span></div>');
  requestAnimationFrame(() => el.classList.add('visible'));
  return el;
}

function removeEl(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }

function updateProgress() {
  const elapsed = Date.now() - startTime;
  const pct = Math.min(100, (elapsed / DURATION) * 100);
  progress.style.width = pct + '%';
  if (pct < 100) animFrame = requestAnimationFrame(updateProgress);
}

async function runDemo() {
  chat.innerHTML = '';
  replayBtn.classList.remove('visible');
  progress.style.width = '0%';
  startTime = Date.now();
  animFrame = requestAnimationFrame(updateProgress);

  // 0.4s – Bot greeting with mood chips
  await wait(400);
  let typing = showTyping();
  await wait(700);
  removeEl(typing);

  addElement(`<div class="msg bot">Welcome! What are you in the mood for?
    <div class="mood-chips">
      <span class="mood-chip" id="chip-comforting">🥟 Comforting</span>
      <span class="mood-chip" id="chip-light">🥬 Light & fresh</span>
      <span class="mood-chip" id="chip-adventurous">🔥 Adventurous</span>
      <span class="mood-chip" id="chip-popular">⭐ Most popular</span>
      <span class="mood-chip" id="chip-menu">📋 Full menu</span>
    </div>
  </div>`);

  // ~3s – User taps "Comforting" chip
  await wait(2000);
  const chip = document.getElementById('chip-comforting');
  if (chip) chip.classList.add('selected');
  await wait(600);

  addElement('<div class="msg user">🥟 Comforting</div>');

  // ~4.5s – Bot responds with comforting picks
  await wait(500);
  typing = showTyping();
  await wait(800);
  removeEl(typing);

  addElement(`<div class="msg bot">Perfect choice. Here's what hits the spot:
    <div class="menu-card">
      <div class="menu-item">
        <div>
          <div class="item-name">Pork Xiao Long Bao (10 pc)</div>
          <div class="item-desc">Signature soup dumplings</div>
        </div>
        <div class="item-price">$13.50</div>
      </div>
      <div class="menu-item">
        <div>
          <div class="item-name">Pork Chop Fried Rice</div>
          <div class="item-desc">Wok-fried, egg, scallion</div>
        </div>
        <div class="item-price">$16.00</div>
      </div>
      <div class="menu-item">
        <div>
          <div class="item-name">Hot & Sour Soup</div>
          <div class="item-desc">Tofu, mushroom, bamboo</div>
        </div>
        <div class="item-price">$9.50</div>
      </div>
    </div>
    <div class="trail-links">
      <span class="trail-link">→ More dumplings</span>
      <span class="trail-link">→ What's in the Xiao Long Bao?</span>
      <span class="trail-link">→ Browse all categories</span>
    </div>
  </div>`);

  // ~9s – User taps "More dumplings"
  await wait(2600);
  addElement('<div class="msg user">More dumplings</div>');

  // ~10s – Bot shows dumpling lineup
  await wait(500);
  typing = showTyping();
  await wait(800);
  removeEl(typing);

  addElement(`<div class="msg bot">Our dumpling lineup:
    <div class="menu-card">
      <div class="menu-item">
        <div>
          <div class="item-name">Pork XLB (10 pc)</div>
          <div class="item-desc">The original</div>
        </div>
        <div class="item-price">$13.50</div>
      </div>
      <div class="menu-item">
        <div>
          <div class="item-name">Truffle XLB (5 pc)</div>
          <div class="item-desc">Black truffle, pork</div>
        </div>
        <div class="item-price">$17.50</div>
      </div>
      <div class="menu-item">
        <div>
          <div class="item-name">Shrimp & Pork Wontons</div>
          <div class="item-desc">Spicy chili oil</div>
        </div>
        <div class="item-price">$12.00</div>
      </div>
    </div>
    <div class="trail-links">
      <span class="trail-link">→ Add Pork XLB to order</span>
      <span class="trail-link">→ Pair with a side</span>
      <span class="trail-link">→ Back to comforting picks</span>
    </div>
  </div>`);

  // End
  await wait(1500);
  cancelAnimationFrame(animFrame);
  progress.style.width = '100%';
  replayBtn.classList.add('visible');
}

function replay() {
  cancelAnimationFrame(animFrame);
  runDemo();
}

// Auto-start on load
runDemo();
</script>
